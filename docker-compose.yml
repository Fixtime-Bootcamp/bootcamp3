services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixtime}
      POSTGRES_USER: ${POSTGRES_USER:-fixtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixtime}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixtime -d fixtime"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/fixtime
      SPRING_DATASOURCE_USERNAME: fixtime
      SPRING_DATASOURCE_PASSWORD: fixtime
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
