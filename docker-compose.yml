services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixtime}
      POSTGRES_USER: ${POSTGRES_USER:-fixtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixtime}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixtime} -d ${POSTGRES_DB:-fixtime}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-fixtime}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fixtime}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fixtime}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    volumes:
      - ./backend/target:/app/target
  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test
    volumes:
      - ./frontend/coverage:/app/coverage
